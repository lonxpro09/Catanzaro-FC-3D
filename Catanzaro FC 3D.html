 if(t=='gf')h+=`<label>Qualità grafica</label><select onchange="ST.q=+this.value;applyQ();sv()">${[['-1','Auto'],['0','Basso'],['1','Medio'],['2','Alto']].map(([v,n])=>`<option value="${v}"${ST.q==v?' selected':''}>${n}</option>`).join('')}</select><div class="keys">Basso: risoluzione 1x, niente ombre, meno pubblico. Auto parte da Basso su telefono e scende di livello se il frame rate cala.</div>`;
 if(t=='rs')h+='<label>Formazione iniziale (il portiere e 5 di movimento)</label>'+[0,1,2,3,4,5].map(i=>`<select onchange="ST.xi[${i}]=+this.value;sv()">${ROS.map((r,k)=>(i==0?r[2]=='P':r[2]!='P')?`<option value="${k}"${ST.xi[i]==k?' selected':''}>#${r[1]} ${r[0]} (${r[2]})</option>`:'').join('')}</select>`).join('')+'<div class="keys">Rosa dal sito ufficiale US Catanzaro 1929 (consultata oggi). Altezze, stili e stelle abilità sono generati dal gioco: non sono dati ufficiali. Le sostituzioni durante la partita non sono ancora implementate: la formazione vale dal prossimo calcio d’inizio.</div>';
 return h}
